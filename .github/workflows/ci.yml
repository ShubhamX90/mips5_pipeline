name: ci
on:
  push:
  pull_request:
jobs:
  regress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3-matplotlib
          iverilog -V | head -1
      - name: Lint, build, unit tests, directed + random regression, benchmarks
        run: make regress RANDOM_SEEDS=200
      - name: Mutation testing (subset)
        run: python3 tools/mutation.py --seeds 20 --only fwd_
