<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 725" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e44ad"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d35400"/></marker>
    <style>
      .stage{fill:#f4f6fa;stroke:#c9d0dc;stroke-width:1}
      .stl{font-size:16px;font-weight:700;fill:#2c3e50;text-anchor:middle}
      .box{fill:#fff;stroke:#4a6fa5;stroke-width:1.5}
      .bt{font-size:13px;fill:#1f2d3d;text-anchor:middle}
      .sm{font-size:11px;fill:#566573;text-anchor:middle}
      .reg{fill:#34495e}
      .rl{font-size:11px;fill:#fff;font-weight:700;text-anchor:middle}
      .w{stroke:#333;stroke-width:1.6;fill:none}
      .fw{stroke:#c0392b;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .ct{stroke:#8e44ad;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .hz{stroke:#d35400;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .unit{fill:#fff7ea;stroke:#d35400;stroke-width:1.5}
      .funit{fill:#fdecea;stroke:#c0392b;stroke-width:1.5}
      .lbl{font-size:11.5px}
    </style>
  </defs>
  <rect width="1300" height="720" fill="#fff"/>
  <text x="650" y="26" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#1f2d3d">MIPS-5: 5-stage pipelined core — datapath, hazard control, forwarding</text>

  <!-- redirect path to PC (top) -->
  <text class="lbl" x="400" y="52" fill="#8e44ad" text-anchor="middle">PC redirect: taken branch / jr / jalr resolved in EX (2 slots flushed) · j / jal resolved in ID (1 slot flushed)</text>

  <!-- panels -->
  <rect class="stage" x="16"  y="70" width="215" height="420" rx="8"/>
  <rect class="stage" x="262" y="70" width="240" height="420" rx="8"/>
  <rect class="stage" x="532" y="70" width="228" height="420" rx="8"/>
  <rect class="stage" x="812" y="70" width="190" height="420" rx="8"/>
  <rect class="stage" x="1052" y="70" width="232" height="420" rx="8"/>
  <text class="stl" x="124"  y="92">IF</text>
  <text class="stl" x="382"  y="92">ID</text>
  <text class="stl" x="646"  y="92">EX</text>
  <text class="stl" x="907"  y="92">MEM</text>
  <text class="stl" x="1168" y="92">WB</text>

  <path class="ct" d="M740 365 H758 V60 H28 V228 H40" marker-end="url(#ac)"/>
  <path class="ct" d="M740 420 H758"/>

  <!-- pipeline registers -->
  <rect class="reg" x="236" y="130" width="18" height="340" rx="3"/><text class="rl" transform="translate(249,300) rotate(-90)">IF/ID</text>
  <rect class="reg" x="506" y="130" width="18" height="340" rx="3"/><text class="rl" transform="translate(519,300) rotate(-90)">ID/EX</text>
  <rect class="reg" x="772" y="130" width="18" height="340" rx="3"/><text class="rl" transform="translate(785,300) rotate(-90)">EX/MEM</text>
  <rect class="reg" x="1022" y="130" width="18" height="340" rx="3"/><text class="rl" transform="translate(1035,300) rotate(-90)">MEM/WB</text>

  <!-- IF -->
  <rect class="box" x="40" y="205" width="56" height="46" rx="6"/><text class="bt" x="68" y="233">PC</text>
  <circle cx="68" cy="160" r="15" class="box"/><text class="bt" x="68" y="165">+4</text>
  <path class="w" d="M68 205 V176" marker-end="url(#a)"/>
  <path class="w" d="M53 160 H44 V196 H68" style="display:none"/>
  <rect class="box" x="128" y="170" width="86" height="116" rx="6"/>
  <text class="bt" x="171" y="216">Instruction</text><text class="bt" x="171" y="233">memory</text><text class="sm" x="171" y="251">combinational</text>
  <path class="w" d="M96 228 H128" marker-end="url(#a)"/>
  <path class="w" d="M214 228 H236" marker-end="url(#a)"/>
  <text class="sm" x="124" y="330">next-PC priority:</text>
  <text class="sm" x="124" y="346">EX redirect &gt; ID jump</text>
  <text class="sm" x="124" y="362">&gt; stall (hold) &gt; PC+4</text>
  <text class="sm" x="124" y="392">unmapped fetch →</text>
  <text class="sm" x="124" y="408">all-ones (illegal)</text>

  <!-- ID -->
  <rect class="box" x="276" y="115" width="124" height="50" rx="6"/><text class="bt" x="338" y="136">Decoder</text><text class="sm" x="338" y="153">+ immediate extend</text>
  <rect class="box" x="282" y="190" width="130" height="130" rx="6"/>
  <text class="bt" x="347" y="228">Register file</text><text class="sm" x="347" y="247">2 read / 1 write</text><text class="sm" x="347" y="263">write-through bypass</text><text class="sm" x="347" y="279">($0 hard-wired 0)</text>
  <rect class="box" x="272" y="345" width="152" height="56" rx="6"/><text class="bt" x="348" y="367">Target adders</text><text class="sm" x="348" y="384">PC+4+imm·4 · jump idx</text>
  <path class="w" d="M254 228 H262 V255 H282" marker-end="url(#a)" style="display:none"/>
  <path class="w" d="M254 140 H276" marker-end="url(#a)"/>
  <path class="w" d="M254 372 H272" marker-end="url(#a)"/>
  <path class="w" d="M412 255 H506" marker-end="url(#a)"/><text class="sm" x="462" y="248">rs, rt values</text>
  <path class="w" d="M400 140 H506" marker-end="url(#a)"/><text class="sm" x="450" y="133">control · imm</text>
  <path class="w" d="M422 373 H506" marker-end="url(#a)"/><text class="sm" x="462" y="366">branch target</text>

  <!-- EX -->
  <rect class="box" x="544" y="150" width="46" height="46" rx="5"/><text class="bt" x="567" y="170">mux</text><text class="bt" x="567" y="187">A</text>
  <rect class="box" x="544" y="228" width="46" height="46" rx="5"/><text class="bt" x="567" y="248">mux</text><text class="bt" x="567" y="265">B</text>
  <path class="w" d="M524 173 H544" marker-end="url(#a)"/>
  <path class="w" d="M524 251 H544" marker-end="url(#a)"/>
  <path class="fw" d="M544 124 H535 V160 H544" marker-end="url(#af)" style="display:none"/>
  <rect class="box" x="610" y="125" width="52" height="30" rx="5"/><text class="bt" x="636" y="145">shamt</text>
  <rect class="box" x="610" y="290" width="52" height="30" rx="5"/><text class="bt" x="636" y="310">imm</text>
  <rect class="box" x="682" y="160" width="62" height="130" rx="6"/><text class="bt" x="713" y="215">ALU</text><text class="sm" x="713" y="233">+ MUL</text>
  <path class="w" d="M590 173 H610 M610 173 H640 M590 173 H676 V190 H682" marker-end="url(#a)"/>
  <path class="w" d="M662 140 H670 V200 H682" marker-end="url(#a)"/>
  <path class="w" d="M590 251 H600 V250 H682" marker-end="url(#a)"/>
  <path class="w" d="M662 305 H674 V270 H682" marker-end="url(#a)"/>
  <path class="w" d="M744 225 H772" marker-end="url(#a)"/>
  
  <rect class="box" x="560" y="345" width="180" height="40" rx="6"/><text class="bt" x="650" y="363">Branch compare</text><text class="sm" x="650" y="378">beq bne blez bgtz bltz bgez</text>
  <rect class="box" x="560" y="400" width="180" height="40" rx="6"/><text class="bt" x="650" y="418">jr target · link = PC+4</text><text class="sm" x="650" y="433">misaligned target → ADDR fault</text>
  <path class="w" d="M550 274 V365 H560" marker-end="url(#a)"/>
  <path class="w" d="M550 196 V345" style="display:none"/>
    <path class="w" d="M590 274 V290" style="display:none"/>
  <path class="w" d="M556 274 V325 H772" marker-end="url(#a)"/><text class="sm" x="668" y="338">store data (rt, forwarded)</text>
  <path class="w" d="M748 365 H758 V400" style="display:none"/>

  <!-- MEM -->
  <rect class="box" x="832" y="150" width="150" height="100" rx="6"/>
  <text class="bt" x="907" y="180">Data memory</text><text class="sm" x="907" y="198">combinational read</text><text class="sm" x="907" y="213">byte-enable write</text><text class="sm" x="907" y="228">alignment · range check</text>
  <rect class="box" x="832" y="290" width="150" height="40" rx="6"/><text class="bt" x="907" y="308">Load align</text><text class="sm" x="907" y="323">sign / zero extend</text>
  <rect class="box" x="832" y="372" width="150" height="46" rx="6"/><text class="bt" x="907" y="392">Store-data bypass</text><text class="sm" x="907" y="408">MEM→MEM from MEM/WB</text>
  <path class="w" d="M790 200 H832" marker-end="url(#a)"/>
  <path class="w" d="M907 250 V290" marker-end="url(#a)"/>
  <path class="w" d="M982 310 H1022" marker-end="url(#a)"/>
  <path class="w" d="M907 372 V350 H870 V250" style="display:none"/>
  <path class="w" d="M790 330 H812 V395 H832" marker-end="url(#a)" style="display:none"/>
  <path class="w" d="M832 395 H820 V232 H832" marker-end="url(#a)"/>
  <path class="w" d="M790 300 H800 V395 H832" marker-end="url(#a)" style="display:none"/>
  <path class="w" d="M790 335 H806 V395 H832" marker-end="url(#a)"/>

  <!-- WB -->
  <rect class="box" x="1076" y="155" width="186" height="76" rx="6"/>
  <text class="bt" x="1169" y="182">Write-back / retire</text><text class="sm" x="1169" y="200">in-order commit point</text><text class="sm" x="1169" y="216">regfile write · trace</text>
  <rect class="box" x="1076" y="262" width="186" height="64" rx="6"/>
  <text class="bt" x="1169" y="288">Halt control</text><text class="sm" x="1169" y="305">BREAK · ILLEGAL · ADDR</text><text class="sm" x="1169" y="319">squashes all younger stages</text>
  <path class="w" d="M1040 193 H1076" marker-end="url(#a)"/>
  <path class="w" d="M1040 290 H1058 V294 H1076" style="display:none"/>
  <path class="w" d="M1169 155 V112 H347 V190" marker-end="url(#a)"/>
  <text class="sm" x="1169" y="106">register write-back (data, address, enable)</text>

  <!-- forwarding unit -->
  <rect class="funit" x="590" y="540" width="250" height="78" rx="8"/>
  <text class="bt" x="715" y="566" style="font-weight:700">Forwarding unit</text>
  <text class="sm" x="715" y="584">youngest in-flight writer wins:</text><text class="sm" x="715" y="600">EX/MEM → EX, then MEM/WB → EX</text>
  <path class="fw" d="M781 470 V510 H740 V540" marker-end="url(#af)"/>
  <path class="fw" d="M1031 470 V520 H800 V540" marker-end="url(#af)"/>
  <path class="fw" d="M620 540 V500 H550 V274" marker-end="url(#af)"/>
  <text class="lbl" x="676" y="528" fill="#c0392b" text-anchor="end" style="display:none"></text>
  <text class="lbl" x="650" y="662" fill="#c0392b" text-anchor="middle">forward selects drive the A/B operand muxes; their data inputs are the EX/MEM result and MEM/WB value</text>

  <!-- hazard unit -->
  <rect class="unit" x="232" y="540" width="290" height="94" rx="8"/>
  <text class="bt" x="377" y="566" style="font-weight:700">Hazard unit</text>
  <text class="sm" x="377" y="584">load-use interlock (precise, 1 cycle)</text>
  <text class="sm" x="377" y="600">EX redirect beats ID jump</text>
  <text class="sm" x="377" y="616">stall PC + IF/ID · flush IF/ID, ID/EX</text>
  <path class="hz" d="M300 540 V320" marker-end="url(#ah)" style="display:none"/>
  <path class="hz" d="M262 540 V496 H340 V320" marker-end="url(#ah)"/>
  <path class="hz" d="M515 470 V515 H470 V540" marker-end="url(#ah)"/>

  <!-- legend -->
  <g transform="translate(900,530)">
    <line x1="0" y1="10" x2="36" y2="10" class="w"/><text class="lbl" x="46" y="14">datapath</text>
    <line x1="0" y1="34" x2="36" y2="34" class="fw"/><text class="lbl" x="46" y="38">operand forwarding</text>
    <line x1="0" y1="58" x2="36" y2="58" class="hz"/><text class="lbl" x="46" y="62">hazard detect / flush / stall</text>
    <line x1="0" y1="82" x2="36" y2="82" class="ct"/><text class="lbl" x="46" y="86">control redirect to PC</text>
  </g>
  <text x="650" y="690" text-anchor="middle" style="font-size:12px;fill:#566573">RAW distance 1 → EX/MEM forward · distance 2 → MEM/WB forward · distance 3 → register-file write-through · load-use → 1 stall, then MEM/WB forward</text>
  <text x="650" y="710" text-anchor="middle" style="font-size:12px;fill:#566573">Harvard memories · no branch delay slot · predict-not-taken · jal/jalr link = PC+4 · MUL completes in one EX cycle</text>
</svg>
